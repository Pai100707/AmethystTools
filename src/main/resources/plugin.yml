name: AmethystTools
version: 1.0.0
main: com.paismp.amethysttools.AmethystToolsPlugin
api-version: "1.20"

commands:
  amethysttools:
    aliases: [at]
    description: AmethystTools main command
    usage: /amethysttools <subcommand>

permissions:
  amethysttools.use:
    default: op
  amethysttools.reload:
    default: op

