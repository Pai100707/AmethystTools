name: AmethystTools
version: ${version}
main: com.paimc.amethysttools.AmethystToolsPlugin
api-version: "1.21"

commands:
  amethysttools:
    aliases: [at]
    description: AmethystTools main command
    usage: /amethysttools <subcommand>

permissions:
  amethysttools.use:
    default: op
  amethysttools.reload:
    default: op
